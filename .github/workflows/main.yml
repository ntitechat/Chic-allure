name: Build and deploy Fassions Mode

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Préparer les fichiers
        run: |
          mkdir -p src public/assets
          cp main.jsx src/main.jsx
          cp styles.css src/styles.css
          cp modele-1.jpg public/assets/modele-1.jpg
          cp modele-2.jpg public/assets/modele-2.jpg
          cp inspiration-poses.png public/assets/inspiration-poses.png

      - name: Installer les dépendances
        run: npm install

      - name: Construire l'application
        run: npm run build

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publier les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Mettre en ligne
        id: deployment
        uses: actions/deploy-pages@v4
